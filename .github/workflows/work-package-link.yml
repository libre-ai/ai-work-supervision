name: Work package link
# Every pull request names the work package of docs/prd.md it implements; the
# gate lives in libre-ai/project-governance (reusable-work-package-link.yml).
# The trigger is `pull_request`, never `pull_request_target`: the latter would
# run with the base repository's secrets and write token over a head its author
# controls. tooling_ref is pinned to the same sha as `uses:`.
'on':
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  work-package-link:
    # The called workflow cannot exceed this grant; under-granted, the gate
    # fails closed. No `container:` here: the gate needs safe.directory.
    permissions:
      contents: read
      issues: read
    uses: libre-ai/project-governance/.github/workflows/reusable-work-package-link.yml@75d6ea085b18cb15d450d7f0f5b1ba9d69645800
    with:
      tooling_ref: 75d6ea085b18cb15d450d7f0f5b1ba9d69645800
