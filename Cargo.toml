# Work Supervision v0 native core (ADR-0042 §3 and §5 in libre-ai/project-governance).
# Every dependency is pinned to an exact version published at least three days
# before it was adopted, mirroring the Bun minimumReleaseAge guard.
[workspace]
resolver = "3"
members = [
  "crates/work-supervision-cli",
  "crates/work-supervision-cockpit",
  "crates/work-supervision-daemon",
  "crates/work-supervision-domain",
  "crates/work-supervision-fake-agent",
  "crates/work-supervision-journal",
  "crates/work-supervision-journal-verifier",
  "crates/work-supervision-pty",
  "crates/work-supervision-store",
  "crates/work-supervision-worktree",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "EUPL-1.2"
repository = "https://github.com/libre-ai/ai-work-supervision"
publish = false

[workspace.dependencies]
nix = { version = "=0.28.0", default-features = false, features = ["socket", "user"] }
portable-pty = { version = "=0.9.0", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_jcs = "=0.2.0"
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.27.0"
tiny_http = { version = "=0.12.0", default-features = false }
vt100 = { version = "=0.16.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
